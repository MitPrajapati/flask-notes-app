{% extends 'base.html' %}
{% block title %} New Notes {% endblock %}
{% block content %}
<main>
    <form action="{{ url_for('notes.create_note') }}" method="post">
            <input type="text" name="title" placeholder="Notes title">
            <br><br>
            <textarea name="content" placeholder="Write your notes"></textarea>
            <br><br>
            <button type="submit">Save Notes</button>
            
    </form>
</main>
{% endblock %}
